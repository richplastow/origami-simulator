<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origami Simulator</title>
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mNoIBEwjGoY1TB8NQAAJYSAELxv8c8AAAAASUVORK5CYII="
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas
      class="scene"
      role="img"
      aria-label="A sheet of origami paper, which folds into simple designs and turns when dragged"
    ></canvas>
    <h1>Origami Simulator</h1>
    <div class="controls">
      <button type="button" data-fold="flat">Flat</button>
      <button type="button" data-fold="paper-dart">Paper Dart</button>
      <button type="button" data-fold="paper-hat">Paper Hat</button>
      <button type="button" data-fold="watermelon">Watermelon</button>
      <label>
        <input type="checkbox" checked data-fold-lines />
        Fold lines
      </label>
      <div class="paper-colors" role="radiogroup" aria-label="Paper colour">
        <input
          type="radio"
          name="paper-color"
          value="red"
          aria-label="Red"
          checked
        />
        <input
          type="radio"
          name="paper-color"
          value="yellow"
          aria-label="Yellow"
        />
        <input
          type="radio"
          name="paper-color"
          value="green"
          aria-label="Green"
        />
        <input
          type="radio"
          name="paper-color"
          value="blue"
          aria-label="Blue"
        />
        <input
          type="radio"
          name="paper-color"
          value="pink"
          aria-label="Pink"
        />
      </div>
    </div>
  </body>
</html>
