<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origami Simulator</title>
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mNoIBEwjGoY1TB8NQAAJYSAELxv8c8AAAAASUVORK5CYII="
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas
      class="scene"
      role="img"
      aria-label="A square sheet of red origami paper, seen from slightly above"
    ></canvas>
    <h1>Origami Simulator</h1>
    <div class="fold-buttons">
      <button type="button" data-fold="flat">Flat</button>
      <button type="button" data-fold="mountain-horizontal">
        Mountain Horizontal
      </button>
      <button type="button" data-fold="valley-diagonal">Valley Diagonal</button>
    </div>
  </body>
</html>
