<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pureland Simulator</title>
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR42mNoIBEwjGoY1TB8NQAAJYSAELxv8c8AAAAASUVORK5CYII="
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas
      class="scene"
      role="img"
      aria-label="A sheet of origami paper, which folds into simple designs and turns when dragged"
    ></canvas>
    <div class="controls">
      <div class="designs" role="radiogroup" aria-label="Design">
        <label>
          <input type="radio" name="design" value="pencil" checked />
          Pencil
        </label>
        <label>
          <input type="radio" name="design" value="mount-fuji" />
          Mount Fuji
        </label>
        <label>
          <input type="radio" name="design" value="flat" />
          Flat
        </label>
        <label>
          <input type="radio" name="design" value="yacht" />
          Yacht
        </label>
        <label>
          <input type="radio" name="design" value="paper-dart" />
          Paper Dart
        </label>
        <label>
          <input type="radio" name="design" value="heart" />
          Heart
        </label>
      </div>
      <label>
        <input type="checkbox" checked data-fold-lines />
        Fold lines
      </label>
      <div class="paper-colors" role="radiogroup" aria-label="Paper colour">
        <input
          type="radio"
          name="paper-color"
          value="red"
          aria-label="Red"
          checked
        />
        <input
          type="radio"
          name="paper-color"
          value="green"
          aria-label="Green"
        />
        <input
          type="radio"
          name="paper-color"
          value="blue"
          aria-label="Blue"
        />
        <input
          type="radio"
          name="paper-color"
          value="orange"
          aria-label="Orange"
        />
        <input
          type="radio"
          name="paper-color"
          value="pink"
          aria-label="Pink"
        />
      </div>
    </div>
  </body>
</html>
